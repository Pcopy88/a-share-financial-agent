[project]
name = "annual-report-agent"
version = "0.1.0"
description = "Evidence-grounded analysis of Chinese financial PDFs"
requires-python = ">=3.11,<3.13"
dependencies = [
  "editables>=0.5,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "httpx>=0.28,<1",
  "pdfplumber>=0.11,<1",
  "pypdfium2>=4.30,<6",
  "tokenizers>=0.21,<1",
  "huggingface-hub>=0.28,<2",
  "chromadb>=1.0,<2",
  "langgraph>=1,<2",
  "langgraph-checkpoint-sqlite>=3,<4",
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "python-multipart>=0.0.20,<1",
  "streamlit>=1.42,<2",
  "pandas>=2.2,<3",
  "jieba>=0.42.1,<1",
  "rank-bm25>=0.2.2,<1",
  "PyYAML>=6,<7",
  "psutil>=6,<8",
]

[project.optional-dependencies]
acquisition = ["akshare>=1.16,<2"]
rerank = ["FlagEmbedding>=1.3,<2", "torch>=2.7,<3"]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.11,<1", "reportlab>=4,<5"]

[project.scripts]
annual-report-agent = "annual_report_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/annual_report_agent"]
dev-mode-exact = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["integration: real local services/files", "live: requires explicitly configured cloud credentials", "slow: longer sample or model checks"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
